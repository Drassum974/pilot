# ÉPINGLAGE DE LA VERSION DE RUST DU DÉPÔT (v0.6.27, décision du 2026-11-16).
#
# Pourquoi ce fichier existe : le dépôt ne fixait AUCUNE version de Rust. Les
# workflows utilisaient `dtolnay/rust-toolchain@stable`, c'est-à-dire la dernière
# version stable du jour de l'exécution — donc une version qui change toute seule
# et qui n'est pas celle du poste de développement. La v0.6.26 s'est arrêtée sur
# l'étape « Run Rust unit tests » des trois systèmes alors que la même commande
# passait (990 tests) sur le poste en 1.95.0, et le journal de la CI n'est pas
# lisible depuis le poste (403) : un écart d'environnement y est indiscernable
# d'un vrai défaut. On supprime l'écart plutôt que de le deviner.
#
# C'est le MÉCANISME STANDARD de Rust : `rustup` lit ce fichier dans le dépôt et
# sélectionne ce canal, en local comme sur les machines de contrôle. Les
# workflows (`release.yml` ×4, `quality-gate.yml` ×1) passent la MÊME valeur à
# l'action (`with: toolchain:`) pour que l'installation ET la sélection soient
# identiques ; le verrou `scripts/rust-toolchain-pin.test.js` refuse une valeur
# divergente (et refuse aussi le retour à `@stable` sans `toolchain:`).
#
# Version choisie : celle du poste qui passe les tests (1.95.0). Ne PAS la
# relever sans relancer, sur la nouvelle version :
#   cargo test --manifest-path src-tauri/Cargo.toml --lib
#   npm test
#   npm run tauri build -- --features whisper
[toolchain]
channel = "1.95.0"
